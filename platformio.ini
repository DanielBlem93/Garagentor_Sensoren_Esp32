; PlatformIO Projektkonfiguration
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serieller Monitor - wichtig zum Debuggen
monitor_speed = 115200

; Upload-Geschwindigkeit (kann bei Verbindungsproblemen reduziert werden, z.B. auf 115200)
upload_speed = 921600
